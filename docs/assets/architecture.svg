<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Atkinson Hyperlegible, Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/>
    </marker>
    <style>
      .box { fill: #FFFFFF; stroke: #1F2937; stroke-width: 2; rx: 14; }
      .soft { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 1.5; rx: 12; }
      .vm { fill: #F8FAFC; stroke: #0F766E; stroke-width: 2.5; rx: 18; }
      .title { font-size: 22px; font-weight: 700; fill: #111827; }
      .label { font-size: 17px; fill: #111827; }
      .small { font-size: 14px; fill: #374151; }
      .muted { font-size: 14px; fill: #6B7280; font-style: italic; }
      .edge { stroke: #4B5563; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edgelabel { font-size: 13.5px; fill: #374151; }
      .pill { fill: #ECFDF5; stroke: #0F766E; stroke-width: 1.5; rx: 10; }
      .pillt { font-size: 15px; fill: #064E3B; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#FFFFFF"/>

  <!-- People -->
  <rect x="60" y="40" width="300" height="86" class="box"/>
  <text x="210" y="74" text-anchor="middle" class="title">You</text>
  <text x="210" y="102" text-anchor="middle" class="small">iMessage, SMS or email. No app.</text>

  <rect x="840" y="40" width="300" height="86" class="box"/>
  <text x="990" y="74" text-anchor="middle" class="title">A friend's Open Instinct</text>
  <text x="990" y="102" text-anchor="middle" class="small">Talks agent to agent (A2A), inside the trust you set.</text>

  <!-- Inkbox -->
  <rect x="60" y="186" width="1080" height="92" class="box"/>
  <text x="600" y="220" text-anchor="middle" class="title">Inkbox: the agent's identity</text>
  <text x="600" y="250" text-anchor="middle" class="small">one handle = iMessage line + phone number + email address + A2A endpoint + signed webhooks</text>

  <!-- Gateway -->
  <rect x="380" y="338" width="440" height="78" class="soft"/>
  <text x="600" y="368" text-anchor="middle" class="label">Gateway (stateless relay, one per deployment)</text>
  <text x="600" y="394" text-anchor="middle" class="small">verifies the signature, finds the person's agent, wakes it, forwards the event</text>

  <!-- Maritime VM -->
  <rect x="60" y="476" width="1080" height="250" class="vm"/>
  <text x="84" y="508" class="title">The agent: one microVM per person on Maritime</text>
  <text x="84" y="532" class="muted">sleeps when idle, wakes in about a second, keeps its files, has its own Linux desktop</text>

  <rect x="84" y="556" width="300" height="150" class="box"/>
  <text x="234" y="586" text-anchor="middle" class="label">server</text>
  <text x="234" y="610" text-anchor="middle" class="small">GET /health · POST /chat · GET /schedules</text>
  <text x="234" y="646" text-anchor="middle" class="label">core (Pi agent loop)</text>
  <text x="234" y="670" text-anchor="middle" class="small">trust tiers · memory · schedules · audit</text>
  <text x="234" y="692" text-anchor="middle" class="small">policy guard runs before every tool</text>

  <rect x="420" y="556" width="200" height="64" class="pill"/>
  <text x="520" y="582" text-anchor="middle" class="pillt">computer</text>
  <text x="520" y="604" text-anchor="middle" class="small">Chromium, LibreOffice, files</text>

  <rect x="640" y="556" width="200" height="64" class="pill"/>
  <text x="740" y="582" text-anchor="middle" class="pillt">apps</text>
  <text x="740" y="604" text-anchor="middle" class="small">Gmail, Calendar via Composio</text>

  <rect x="860" y="556" width="256" height="64" class="pill"/>
  <text x="988" y="582" text-anchor="middle" class="pillt">inkbox</text>
  <text x="988" y="604" text-anchor="middle" class="small">send iMessage, SMS, email, typing</text>

  <rect x="420" y="640" width="200" height="64" class="pill"/>
  <text x="520" y="666" text-anchor="middle" class="pillt">network</text>
  <text x="520" y="688" text-anchor="middle" class="small">contacts, tiers, A2A</text>

  <rect x="640" y="640" width="200" height="64" class="pill"/>
  <text x="740" y="666" text-anchor="middle" class="pillt">payments</text>
  <text x="740" y="688" text-anchor="middle" class="small">Stripe Link one-time cards</text>

  <rect x="860" y="640" width="256" height="64" class="pill"/>
  <text x="988" y="666" text-anchor="middle" class="pillt">skills</text>
  <text x="988" y="688" text-anchor="middle" class="small">travel, dining, rides, email, research</text>

  <!-- Edges -->
  <path d="M 210 126 L 210 186" class="edge"/>
  <text x="222" y="162" class="edgelabel">"connect @maria" then just text</text>

  <path d="M 990 126 L 990 186" class="edge"/>
  <text x="1002" y="162" class="edgelabel">A2A JSON-RPC</text>

  <path d="M 600 278 L 600 338" class="edge"/>
  <text x="612" y="314" class="edgelabel">signed webhook</text>

  <path d="M 600 416 L 600 476" class="edge"/>
  <text x="612" y="452" class="edgelabel">POST /chat (Maritime wakes the VM)</text>

  <path d="M 1116 588 C 1170 588 1170 232 1140 232" class="edge"/>
  <text x="1046" y="466" class="edgelabel" text-anchor="end">replies go out through Inkbox</text>
</svg>
