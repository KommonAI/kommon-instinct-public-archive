<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
:root{--ink:#111;--teal:#0F766E;--muted:#555;--blue:#1F8AFF}
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink)}
.page{width:1600px;height:900px;position:relative;overflow:hidden}
.node{position:absolute;text-align:center}
.node .ic{width:120px;height:120px;border:3px solid var(--ink);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;filter:url(#rough)}
.node .ic img{width:62px;height:62px;border-radius:14px;object-fit:contain}
.node h3{margin:0;font-size:24px}
.node p{margin:4px 0 0;font-size:16px;color:#333;line-height:1.3}
.lbl{position:absolute;font-size:16px;color:#222;background:#fff;padding:2px 8px;border-radius:8px}
.title{position:absolute;left:56px;top:40px}
.title h1{margin:0;font-size:34px;letter-spacing:-.01em}.title p{margin:4px 0 0;color:var(--muted);font-size:18px}
.foot{position:absolute;bottom:26px;left:56px;right:56px;display:flex;justify-content:space-between;color:var(--muted);font-size:13.5px}
.phone{width:70px;height:112px;border:3px solid var(--ink);border-radius:14px;position:relative;background:#fff}
.phone:after{content:"";position:absolute;left:14px;top:24px;width:42px;height:28px;border:2.5px solid var(--ink);border-radius:9px 9px 9px 2px}
.logos{display:flex;gap:10px;justify-content:center;margin-top:8px}.logos img{width:34px;height:34px;border-radius:8px;object-fit:contain;border:1.5px solid #ddd;background:#fff}
</style></head><body><div class="page">
<svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs></svg>
